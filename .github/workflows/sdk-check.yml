name: SDK checks
on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'mcp/**'
  push:
    branches: [cursor/sdk-v2, main]
    paths:
      - 'sdk/**'

jobs:
  no-hardcoded-addresses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm run check:addresses
        working-directory: sdk
