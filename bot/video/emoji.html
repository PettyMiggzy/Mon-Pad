<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
const SIZE = 400;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50); camera.position.set(0, 0, 6.2); camera.lookAt(0, 0, 0);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));
const key = new THREE.DirectionalLight(0xfff1e0, 3.0); key.position.set(2.5, 3, 5); scene.add(key);
const pink = new THREE.PointLight(0xff4d9a, 40, 12); pink.position.set(-3, 1, 2); scene.add(pink);
const violet = new THREE.PointLight(0xb57bff, 30, 12); violet.position.set(3, -1, 2); scene.add(violet);

const tex = await new THREE.TextureLoader().loadAsync('/public/meshy/monshi-face.png');
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;

const coin = new THREE.Group(); scene.add(coin);
const R = 1.25, TH = 0.22;
// gold body + purple rim, faces carry Monshi
const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, TH, 64, 1, false), new THREE.MeshStandardMaterial({ color: 0xffc23a, metalness: 0.75, roughness: 0.28, emissive: 0x4a2a00, emissiveIntensity: 0.3 }));
body.rotation.x = Math.PI / 2; coin.add(body);
const rim = new THREE.Mesh(new THREE.TorusGeometry(R, 0.075, 20, 80), new THREE.MeshStandardMaterial({ color: 0x9a4dff, metalness: 0.5, roughness: 0.25, emissive: 0x3a1080, emissiveIntensity: 0.5 }));
rim.position.z = TH / 2; coin.add(rim); const rim2 = rim.clone(); rim2.position.z = -TH / 2; coin.add(rim2);
const faceMat = new THREE.MeshStandardMaterial({ map: tex, metalness: 0.1, roughness: 0.45, transparent: true });
const front = new THREE.Mesh(new THREE.CircleGeometry(R * 0.94, 64), faceMat); front.position.z = TH / 2 + 0.004; coin.add(front);
const back = new THREE.Mesh(new THREE.CircleGeometry(R * 0.94, 64), faceMat); back.position.z = -TH / 2 - 0.004; back.rotation.y = Math.PI; coin.add(back);

const T = 2.0;
window.setT = (t) => {
  const w = 2 * Math.PI * t / T;
  coin.rotation.y = w;                 // one full spin per loop
  coin.rotation.x = Math.sin(w) * 0.12; // slight wobble so it reads as 3D
  coin.rotation.z = Math.sin(w) * 0.05;
  coin.position.y = Math.sin(2 * w) * 0.05;
  pink.intensity = 40 + Math.sin(w) * 10;
  renderer.render(scene, camera);
};
window.T = T; window.ready = true; setT(0);
</script>
</body>
</html>
