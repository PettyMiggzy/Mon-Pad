<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const QS = new URLSearchParams(location.search);
const SIZE = Number(QS.get('size') || 512);
const CY = Number(QS.get('cy') || 0.5), CZ = Number(QS.get('cz') || 6.4); // zoom for the pose lab
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, CY, CZ); camera.lookAt(0, CY, 0);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const key = new THREE.DirectionalLight(0xfff1e0, 2.6); key.position.set(2.5, 4, 5); scene.add(key);
const rimL = new THREE.PointLight(0xff4d9a, 55, 14); rimL.position.set(-3.2, 1.5, -1.5); scene.add(rimL);
const rimR = new THREE.PointLight(0xb57bff, 45, 14); rimR.position.set(3.4, 0.5, -1); scene.add(rimR);
const fill = new THREE.PointLight(0xffffff, 16, 12); fill.position.set(0, 0.5, 4.5); scene.add(fill);

const root = new THREE.Group(); scene.add(root);
const bones = {}, rest = {};
const NAMES = ['Head', 'neck', 'Spine', 'Spine01', 'Spine02', 'Hips', 'RightShoulder', 'LeftShoulder', 'RightArm', 'RightForeArm', 'RightHand', 'LeftArm', 'LeftForeArm', 'LeftHand', 'RightUpLeg', 'LeftUpLeg', 'RightLeg', 'LeftLeg'];
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync('/public/models/monshi.glb');
const model = gltf.scene; model.traverse((o) => { if (o.isMesh) o.frustumCulled = false; });
{ const box = new THREE.Box3().setFromObject(model); const sz = box.getSize(new THREE.Vector3()); model.scale.setScalar(2.35 / sz.y); model.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(model); const c = b2.getCenter(new THREE.Vector3()); model.position.set(-c.x, -b2.min.y, -c.z); }
root.add(model); root.position.y = -1.2;
{ const hips = model.getObjectByName('Hips'); const v = new THREE.Vector3(); hips.getWorldPosition(v); model.position.x -= v.x; model.position.z -= v.z; }
for (const n of NAMES) { const o = model.getObjectByName(n); if (o) { bones[n] = o; rest[n] = o.quaternion.clone(); } }

const E = new THREE.Euler(), Q = new THREE.Quaternion();
const set = (n, x = 0, y = 0, z = 0) => { const b = bones[n]; if (!b) return; E.set(x, y, z); Q.setFromEuler(E); b.quaternion.copy(rest[n]).multiply(Q); };
const reset = () => { for (const n in bones) bones[n].quaternion.copy(rest[n]); root.position.set(0, -1.2, 0); root.rotation.set(0, 0, 0); root.scale.set(1, 1, 1); };

const T = 2.0; // loop length (s): every motion below uses whole multiples of w so the clip loops seamlessly
const POSES = {
  celebrate: (w) => {
    const hop = Math.abs(Math.sin(w)) * 0.36;
    root.position.y = -1.2 + hop; root.rotation.y = Math.sin(w) * 0.25;
    set('RightArm', 0, -1.2, -2.6 + Math.sin(2 * w) * 0.14); set('LeftArm', 0, 1.2, 2.6 - Math.sin(2 * w) * 0.14); // y = twist, so the palms face each other
    set('Spine01', -0.1, Math.sin(w) * 0.1, 0); set('Head', -0.1, Math.sin(w) * 0.2, Math.sin(2 * w) * 0.06);
  },
  wave: (w) => {
    root.rotation.y = Math.sin(w) * 0.12; root.position.y = -1.2 + Math.abs(Math.sin(2 * w)) * 0.03;
    set('RightArm', 0, -0.9, -2.25); set('RightForeArm', 0, 0, -0.5 + Math.sin(4 * w) * 0.55);
    set('LeftArm', 0, 0, 0.2); set('Spine01', 0, Math.sin(w) * 0.1, Math.sin(w) * 0.04); set('Head', 0, Math.sin(w) * 0.18, Math.sin(w) * 0.1 - 0.05);
  },
  dance: (w) => {
    root.position.y = -1.2 + Math.abs(Math.sin(2 * w)) * 0.12; root.rotation.y = Math.sin(w) * 0.5; root.rotation.z = Math.sin(2 * w) * 0.04;
    const a = Math.sin(2 * w);
    set('RightArm', 0, -0.5 - a * 0.4, -1.6 - a * 1.0); set('LeftArm', 0, 0.5 - a * 0.4, 1.6 - a * 1.0);
    set('Spine01', 0, Math.sin(2 * w) * 0.25, Math.sin(2 * w) * 0.08); set('Head', 0.05 + Math.sin(4 * w) * 0.08, -Math.sin(2 * w) * 0.3, Math.sin(2 * w) * 0.12);
    set('RightUpLeg', Math.sin(2 * w + 1) * 0.18, 0, 0); set('LeftUpLeg', -Math.sin(2 * w + 1) * 0.18, 0, 0);
  },
  facepalm: (w) => {
    const sway = Math.sin(w);
    root.rotation.y = sway * 0.08; root.position.y = -1.2 - 0.02;
    set('RightArm', -0.8 + sway * 0.04, 0, -0.8); set('RightForeArm', -1.9 + sway * 0.05, 0, -0.4);
    set('LeftArm', 0, 0, 0.2); set('Spine01', 0.12, 0, 0); set('Head', 0.38 + sway * 0.05, sway * 0.12, -0.08);
  },
  hype: (w) => {
    const p = Math.abs(Math.sin(w));
    root.position.y = -1.2 + p * 0.05; root.rotation.y = Math.sin(w) * 0.2;
    set('RightArm', 0, -0.7, -1.0); set('RightForeArm', 0, 0, -1.9 - p * 0.25);
    set('LeftArm', 0, 0.7, 1.0); set('LeftForeArm', 0, 0, 1.9 + p * 0.25);
    set('Spine01', -0.08, Math.sin(w) * 0.06, 0); set('Head', -0.1, Math.sin(w) * 0.2, 0);
  },
  angry: (w) => {
    const sh = Math.sin(4 * w);
    root.rotation.z = Math.sin(8 * w) * 0.015; root.position.y = -1.2 + Math.abs(Math.sin(2 * w)) * 0.03;
    set('Spine01', 0.2, sh * 0.06, 0); set('Head', 0.22, sh * 0.34, sh * 0.08);
    set('RightArm', -0.35, 0, -0.5); set('RightForeArm', -0.9, 0, 0); set('LeftArm', -0.35, 0, 0.5); set('LeftForeArm', -0.9, 0, 0);
  },
  happy: (w) => {
    const hop = Math.abs(Math.sin(w));
    root.position.y = -1.2 + hop * 0.22; root.rotation.y = Math.sin(w) * 0.3;
    set('RightArm', 0, 0, -0.5 - hop * 0.6); set('LeftArm', 0, 0, 0.5 + hop * 0.6);
    set('Spine01', -0.05, Math.sin(w) * 0.12, Math.sin(w) * 0.05); set('Head', -0.08, Math.sin(w) * 0.25, Math.sin(2 * w) * 0.1);
    set('RightUpLeg', -hop * 0.1, 0, 0); set('LeftUpLeg', -hop * 0.1, 0, 0);
  },
  sleepy: (w) => {
    root.rotation.z = Math.sin(w) * 0.05; root.position.y = -1.2 - 0.04 + Math.sin(w) * 0.03;
    set('Spine01', 0.28 + Math.sin(w) * 0.04, 0, 0); set('Head', 0.55 + Math.sin(w) * 0.12, 0, Math.sin(w) * 0.12);
    set('RightArm', 0, 0, 0.15); set('LeftArm', 0, 0, -0.15);
  },
};
window.POSES = POSES;
window.custom = (cfg, tilt) => { reset(); if (cfg) for (const k in cfg) set(k, ...cfg[k]); renderer.render(scene, camera); };
window.setPose = (name, t) => { reset(); POSES[name](2 * Math.PI * t / T); rimL.intensity = 55 + Math.sin(4 * Math.PI * t / T) * 10; renderer.render(scene, camera); };
window.T = T; window.ready = true;
renderer.render(scene, camera);
</script>
</body>
</html>
